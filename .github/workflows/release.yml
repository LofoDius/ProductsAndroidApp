name: Build and deploy release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.DEPLOY_API_URL }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: Find release APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload release to deployment API
        env:
          DEPLOY_API_URL: ${{ secrets.DEPLOY_API_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          curl -f -X POST "$DEPLOY_API_URL/app/releases" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -F "file=@$APK_PATH" \
            -F "versionCode=${{ github.run_number }}" \
            -F "versionName=1.0.${{ github.run_number }}"

      - name: Upload release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
